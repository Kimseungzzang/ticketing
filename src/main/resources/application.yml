server:
  port: 8083

myredis:
  host: localhost
  port: 6379
  pool-size: 4

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:booking_db}
    username: ${DB_USERNAME:kimseungzzang}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
mykafka:
  host: ${MYKAFKA_HOST:localhost}
  port: ${MYKAFKA_PORT:9092}

booking:
  kafka:
    topic: booking-events
  seat:
    lock-ttl-sec: 300

# 모니터링: Prometheus가 /actuator/prometheus를 스크랩 (RUN_LOG §19)
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  metrics:
    tags:
      application: booking-service
    distribution:
      percentiles-histogram:
        http.server.requests: true

