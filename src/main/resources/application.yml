server:
  port: 8082

spring:
  data:
    redis:
      # LAN 다원화: 각 기기의 queue가 '중앙 Redis 한 대'를 바라봐야 sorted set/리더락이 공유된다.
      #   MYREDIS_HOST=<중앙기기IP>로 지정. 미지정 시 localhost(단일 기기 테스트).
      # Lettuce는 기본적으로 커넥션 하나를 멀티플렉싱해서 쓰므로(myredis-client-starter의 pool-size=4처럼
      # 고정 개수를 빌렸다 반납하는 블로킹 풀이 아님) 별도 pool 설정을 안 둔다.
      host: ${MYREDIS_HOST:localhost}
      port: ${MYREDIS_PORT:6379}

# 대기열 slot(동시 입장 허용 수). 기본 1000. env QUEUE_MAX_ACTIVE_CAP로 조절.
#   admit 스케줄러가 activeCount < slot 일 때만 입장시킨다 → 처리량 상한.
queue:
  max-active-cap: ${QUEUE_MAX_ACTIVE_CAP:1000}

# 모니터링: 기본은 health만 노출(prometheus/metrics 비활성).
#   Prometheus로 다시 긁으려면 MANAGEMENT_EXPOSURE=health,prometheus,metrics 로 재기동.
#   (L4 로드밸런서 경유로 긁으면 비즈니스 경로로 새어 openmetrics 변환 에러가 났었음 → 기본 비활성)
management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_EXPOSURE:health}
  metrics:
    tags:
      application: queue-service
    distribution:
      percentiles-histogram:
        http.server.requests: true
