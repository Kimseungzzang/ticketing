spring:
  application:
    name: ticket-query-service
  datasource:
    # command와 물리적으로 분리된 read model 전용 DB.
    # 이 DB의 유일한 writer는 MyKafka consumer(ReadModelUpdater)다.
    # (read-only Hikari는 consumer가 써야 하므로 제거.)
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ticket_read_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # read DB의 스키마는 이제 query가 소유한다(빈 DB에 부팅 시 테이블 생성).
      # 생성 후 mock-data.sql로 정적 참조데이터를 시드한다.
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

mykafka:
  host: ${KAFKA_HOST:localhost}
  port: ${KAFKA_PORT:9092}

server:
  port: ${PORT:8083}
