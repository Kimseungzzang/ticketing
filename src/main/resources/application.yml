server:
  port: 8082

myredis:
  host: localhost
  port: 6379
  pool-size: 4

# 모니터링: Prometheus가 /actuator/prometheus를 스크랩 (RUN_LOG §19)
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  metrics:
    tags:
      application: queue-service
    distribution:
      percentiles-histogram:
        http.server.requests: true
