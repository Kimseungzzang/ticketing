spring:
  application:
    name: ticket-command-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ticket_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

mykafka:
  host: ${KAFKA_HOST:localhost}
  port: ${KAFKA_PORT:9092}
  producer:
    pool-size: ${KAFKA_PRODUCER_POOL_SIZE:8}   # 동시 발행 connection 수
  outbox:
    poll-ms: ${OUTBOX_POLL_MS:200}             # outbox relay 폴링 주기

server:
  port: ${PORT:8084}
