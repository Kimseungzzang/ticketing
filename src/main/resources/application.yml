server:
  port: 8083

myredis:
  host: localhost
  port: 6379
  pool-size: 4

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:booking_db}
    username: ${DB_USERNAME:kimseungzzang}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
booking:
  kafka:
    topic: booking-events
  seat:
    lock-ttl-sec: 10

