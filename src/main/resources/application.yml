server:
  port: 8080

auth:
  service:
    url: http://localhost:8081
  public-paths:
    - /api/auth/register
    - /api/auth/login
    - /api/auth/refresh

spring:
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:3000"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
        - id: queue-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/queue/**
        - id: booking-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/booking/**
